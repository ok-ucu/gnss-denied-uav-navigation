# Мішень Kalibr. ЗНАЧЕННЯ МАЮТЬ ЗБІГАТИСЯ З ВИДРУКОВАНИМ АРКУШЕМ:
# після друку виміряй лінійкою сторону одного тега (чорний квадрат) - у метрах.
# Друкувати 100% (без "підгонки під сторінку"), клеїти на жорстку пласку основу.
target_type: 'aprilgrid'
tagCols: 6
tagRows: 6
tagSize: 0.055       # м, сторона тега (ПЕРЕВІРИТИ після друку)
tagSpacing: 0.3      # відношення проміжку між тегами до tagSize (для стандартного 6x6 = 0.3)
