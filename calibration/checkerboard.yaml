# Альтернативна калібрувальна мішень: шахова дошка (checkerboard).
# Якщо використовуєте шахову дошку замість AprilGrid:
# Рахуються ВНУТРІШНІ кути сітки (кількість клітинок мінус 1).
# Наприклад, дошка 8x7 чорно-білих квадратів має 7x6 внутрішніх кутів.
target_type: 'checkerboard'
targetCols: 7            # кількість внутрішніх кутів по ширині
targetRows: 6            # кількість внутрішніх кутів по висоті
rowSpacingMeters: 0.030  # розмір клітинки (сторона квадрата), м (виміряти лінійкою після друку!)
colSpacingMeters: 0.030  # зазвичай дошка квадратна, тому rowSpacing == colSpacing
